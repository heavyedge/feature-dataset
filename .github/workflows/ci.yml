name: CI

on:
  push:
  pull_request:

jobs:

  lint:

    runs-on: ubuntu-latest

    steps:

      - name: get repo
        uses: actions/checkout@v3

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: install dependencies
        run: |
          pip install flake8 "black[jupyter]" isort

      - name: lint with flake8
        run: |
          flake8

      - name: lint with black
        run: |
          black --check .

      - name: lint with isort
        run: |
          isort --check .

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: set up uv
        uses: astral-sh/setup-uv@v5

      - name: set up the environment
        run: HEAVYEDGE_TEST_MODE=1 ./setup.sh
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}

      - name: install dependencies
        run: uv pip install --system -r requirements.txt

      - name: test build
        run: HEAVYEDGE_TEST_MODE=1 make

      - uses: actions/upload-artifact@v4
        with:
          name: profile-dataset
          path: _data/v1/mean_profiles/dataset1/001*
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: feature-dataset
          path: datasets/v1/shape_features/mean_profiles/dataset1.csv
          retention-days: 1
